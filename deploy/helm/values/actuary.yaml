# Actuary: retirement projections (Java, CPU-heavy simulations).
port: 8202
secretEnv: [SERVICE_TOKEN]
env:
  MCP_ADVISOR_TOOLS_URL: http://advisor-tools:8500/mcp
resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { memory: 768Mi }
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
