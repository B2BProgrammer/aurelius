# The Secret every agent reads its secret settings from (only the keys listed in
# its values file's secretEnv). NEVER commit real values. Create it per namespace:
#
#   kubectl create namespace aurelius-dev
#   kubectl -n aurelius-dev create secret generic aurelius-secrets \
#     --from-literal=SERVICE_TOKEN=<48+ random chars> \
#     --from-literal=JWT_SIGNING_KEY=<64+ random chars> \
#     --from-literal=ANTHROPIC_API_KEY=<key or empty> \
#     --from-literal=DEV_LOGIN_PASSWORD=<demo password, empty in prod>
#
# And the one that lets the cluster pull images from Artifactory:
#   kubectl -n aurelius-dev create secret docker-registry artifactory-pull \
#     --docker-server=mycompany.jfrog.io --docker-username=<user> --docker-password=<token>
#
# In a real company these come from a vault (HashiCorp Vault, AWS Secrets Manager,
# Azure Key Vault) through the External Secrets Operator, not from a file.
apiVersion: v1
kind: Secret
metadata:
  name: aurelius-secrets
type: Opaque
stringData:
  SERVICE_TOKEN: replace-with-48-random-characters
  JWT_SIGNING_KEY: replace-with-64-random-characters
  ANTHROPIC_API_KEY: ""
  DEV_LOGIN_PASSWORD: ""
